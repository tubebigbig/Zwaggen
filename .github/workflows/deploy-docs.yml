name: deploy-docs

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main at full depth
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture deploy SHA
        id: sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "DEPLOY_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Deploy SHA: $SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Smoke-build docs
        run: pnpm --filter docs build

      - name: Configure git author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: FF-push main → docs
        run: |
          if ! git push origin HEAD:docs; then
            echo "push rejected; pulling --rebase docs and retrying once"
            git fetch origin docs
            git pull --rebase origin docs
            git push origin HEAD:docs
          fi

      - name: Step summary
        if: always()
        run: |
          {
            echo "## Docs deploy"
            echo ""
            echo "- SHA: \`${DEPLOY_SHA}\`"
            echo "- Branch: \`docs\`"
            echo "- Cloudflare Pages dashboard: https://dash.cloudflare.com"
          } >> "$GITHUB_STEP_SUMMARY"
