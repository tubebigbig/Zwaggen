appId: com.zwaggen.desktop
productName: Zwaggen
copyright: © 2026 Victor Liang
asar: true

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../web/dist
    to: web

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  identity: null
  icon: build/icon.icns

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  icon: build/icon.png
