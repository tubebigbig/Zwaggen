appId: com.zwaggen.desktop
productName: Zwaggen
copyright: © 2026 Victor Liang
asar: true

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

# The renderer (apps/web) is NOT in `files`. It ships as an extra resource
# so main.ts can resolve it via process.resourcesPath/web/index.html when
# app.isPackaged is true.
extraResources:
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
      - "!_headers"
      - "!_redirects"

fileAssociations:
  - ext: zwag
    name: Zwaggen Spec
    description: Zwaggen API specification
    role: Editor
    icon: build/icon.icns        # mac uses .icns; electron-builder maps win/linux automatically
    mimeType: application/x-zwaggen-spec

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  identity: null
  icon: build/icon.icns

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  icon: build/icon.ico

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Development
  icon: build/icon.png
